<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<title>Læringslupa — ikonvarianter</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f0f0f0;
    padding: 40px;
    color: #333;
  }
  h1 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.08em; color: #888; margin-bottom: 32px; }
  .grid { display: flex; gap: 36px; flex-wrap: wrap; }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 28px 24px 20px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.10);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    min-width: 160px;
  }
  .sizes { display: flex; align-items: flex-end; gap: 14px; }
  .label { font-size: 11px; color: #999; text-align: center; margin-top: 4px; letter-spacing: 0.04em; }
  .name { font-size: 12px; font-weight: 600; color: #555; margin-top: 4px; }
  svg { display: block; }
</style>
</head>
<body>

<h1>Læringslupa — 5 ikonvarianter</h1>
<div class="grid">

  <!-- 1: Klassisk — mørk grøn, kvit lupe -->
  <div class="card">
    <div class="name">1 · Klassisk</div>
    <div class="sizes">
      <!-- 128px -->
      <div>
        <svg width="128" height="128" viewBox="0 0 128 128">
          <rect width="128" height="128" rx="28" fill="#1b5e20"/>
          <circle cx="52" cy="50" r="28" fill="none" stroke="#ffffff" stroke-width="11"/>
          <circle cx="52" cy="50" r="17" fill="#2e7d3244"/>
          <line x1="73" y1="71" x2="98" y2="97" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
        </svg>
        <div class="label">128</div>
      </div>
      <!-- 48px -->
      <div>
        <svg width="48" height="48" viewBox="0 0 128 128">
          <rect width="128" height="128" rx="28" fill="#1b5e20"/>
          <circle cx="52" cy="50" r="28" fill="none" stroke="#ffffff" stroke-width="11"/>
          <circle cx="52" cy="50" r="17" fill="#2e7d3244"/>
          <line x1="73" y1="71" x2="98" y2="97" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
        </svg>
        <div class="label">48</div>
      </div>
      <!-- 16px -->
      <div>
        <svg width="16" height="16" viewBox="0 0 128 128">
          <rect width="128" height="128" rx="28" fill="#1b5e20"/>
          <circle cx="52" cy="50" r="28" fill="none" stroke="#ffffff" stroke-width="11"/>
          <circle cx="52" cy="50" r="17" fill="#2e7d3244"/>
          <line x1="73" y1="71" x2="98" y2="97" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
        </svg>
        <div class="label">16</div>
      </div>
    </div>
  </div>

  <!-- 2: Kritt — kvit bakgrunn, mørk grøn lupe, skugge -->
  <div class="card">
    <div class="name">2 · Kritt</div>
    <div class="sizes">
      <div>
        <svg width="128" height="128" viewBox="0 0 128 128">
          <rect width="128" height="128" rx="28" fill="#ffffff"/>
          <rect width="128" height="128" rx="28" fill="none" stroke="#e0e0e0" stroke-width="2"/>
          <circle cx="52" cy="50" r="28" fill="none" stroke="#1b5e20" stroke-width="11"/>
          <circle cx="52" cy="50" r="17" fill="#e8f5e9"/>
          <line x1="73" y1="71" x2="98" y2="97" stroke="#1b5e20" stroke-width="12" stroke-linecap="round"/>
        </svg>
        <div class="label">128</div>
      </div>
      <div>
        <svg width="48" height="48" viewBox="0 0 128 128">
          <rect width="128" height="128" rx="28" fill="#ffffff"/>
          <rect width="128" height="128" rx="28" fill="none" stroke="#e0e0e0" stroke-width="2"/>
          <circle cx="52" cy="50" r="28" fill="none" stroke="#1b5e20" stroke-width="11"/>
          <circle cx="52" cy="50" r="17" fill="#e8f5e9"/>
          <line x1="73" y1="71" x2="98" y2="97" stroke="#1b5e20" stroke-width="12" stroke-linecap="round"/>
        </svg>
        <div class="label">48</div>
      </div>
      <div>
        <svg width="16" height="16" viewBox="0 0 128 128">
          <rect width="128" height="128" rx="28" fill="#ffffff"/>
          <rect width="128" height="128" rx="28" fill="none" stroke="#e0e0e0" stroke-width="2"/>
          <circle cx="52" cy="50" r="28" fill="none" stroke="#1b5e20" stroke-width="11"/>
          <circle cx="52" cy="50" r="17" fill="#e8f5e9"/>
          <line x1="73" y1="71" x2="98" y2="97" stroke="#1b5e20" stroke-width="12" stroke-linecap="round"/>
        </svg>
        <div class="label">16</div>
      </div>
    </div>
  </div>

  <!-- 3: Kol — svart bakgrunn, limegrøn lupe -->
  <div class="card">
    <div class="name">3 · Kol</div>
    <div class="sizes">
      <div>
        <svg width="128" height="128" viewBox="0 0 128 128">
          <rect width="128" height="128" rx="28" fill="#1a1a1a"/>
          <circle cx="52" cy="50" r="28" fill="none" stroke="#69f0ae" stroke-width="11"/>
          <circle cx="52" cy="50" r="17" fill="#69f0ae18"/>
          <line x1="73" y1="71" x2="98" y2="97" stroke="#69f0ae" stroke-width="12" stroke-linecap="round"/>
        </svg>
        <div class="label">128</div>
      </div>
      <div>
        <svg width="48" height="48" viewBox="0 0 128 128">
          <rect width="128" height="128" rx="28" fill="#1a1a1a"/>
          <circle cx="52" cy="50" r="28" fill="none" stroke="#69f0ae" stroke-width="11"/>
          <circle cx="52" cy="50" r="17" fill="#69f0ae18"/>
          <line x1="73" y1="71" x2="98" y2="97" stroke="#69f0ae" stroke-width="12" stroke-linecap="round"/>
        </svg>
        <div class="label">48</div>
      </div>
      <div>
        <svg width="16" height="16" viewBox="0 0 128 128">
          <rect width="128" height="128" rx="28" fill="#1a1a1a"/>
          <circle cx="52" cy="50" r="28" fill="none" stroke="#69f0ae" stroke-width="11"/>
          <circle cx="52" cy="50" r="17" fill="#69f0ae18"/>
          <line x1="73" y1="71" x2="98" y2="97" stroke="#69f0ae" stroke-width="12" stroke-linecap="round"/>
        </svg>
        <div class="label">16</div>
      </div>
    </div>
  </div>

  <!-- 4: Djupblå — navy, gul/gull lupe -->
  <div class="card">
    <div class="name">4 · Djupblå</div>
    <div class="sizes">
      <div>
        <svg width="128" height="128" viewBox="0 0 128 128">
          <rect width="128" height="128" rx="28" fill="#0d2b5e"/>
          <circle cx="52" cy="50" r="28" fill="none" stroke="#ffd740" stroke-width="11"/>
          <circle cx="52" cy="50" r="17" fill="#ffd74018"/>
          <line x1="73" y1="71" x2="98" y2="97" stroke="#ffd740" stroke-width="12" stroke-linecap="round"/>
        </svg>
        <div class="label">128</div>
      </div>
      <div>
        <svg width="48" height="48" viewBox="0 0 128 128">
          <rect width="128" height="128" rx="28" fill="#0d2b5e"/>
          <circle cx="52" cy="50" r="28" fill="none" stroke="#ffd740" stroke-width="11"/>
          <circle cx="52" cy="50" r="17" fill="#ffd74018"/>
          <line x1="73" y1="71" x2="98" y2="97" stroke="#ffd740" stroke-width="12" stroke-linecap="round"/>
        </svg>
        <div class="label">48</div>
      </div>
      <div>
        <svg width="16" height="16" viewBox="0 0 128 128">
          <rect width="128" height="128" rx="28" fill="#0d2b5e"/>
          <circle cx="52" cy="50" r="28" fill="none" stroke="#ffd740" stroke-width="11"/>
          <circle cx="52" cy="50" r="17" fill="#ffd74018"/>
          <line x1="73" y1="71" x2="98" y2="97" stroke="#ffd740" stroke-width="12" stroke-linecap="round"/>
        </svg>
        <div class="label">16</div>
      </div>
    </div>
  </div>

  <!-- 5: Skifer — mørk grå-grøn, kvit lupe, gradient -->
  <div class="card">
    <div class="name">5 · Skifer</div>
    <div class="sizes">
      <div>
        <svg width="128" height="128" viewBox="0 0 128 128">
          <defs>
            <linearGradient id="g5" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#2e4057"/>
              <stop offset="100%" stop-color="#1b5e20"/>
            </linearGradient>
          </defs>
          <rect width="128" height="128" rx="28" fill="url(#g5)"/>
          <circle cx="52" cy="50" r="28" fill="none" stroke="#ffffff" stroke-width="11"/>
          <circle cx="52" cy="50" r="17" fill="#ffffff18"/>
          <line x1="73" y1="71" x2="98" y2="97" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
        </svg>
        <div class="label">128</div>
      </div>
      <div>
        <svg width="48" height="48" viewBox="0 0 128 128">
          <defs>
            <linearGradient id="g5b" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#2e4057"/>
              <stop offset="100%" stop-color="#1b5e20"/>
            </linearGradient>
          </defs>
          <rect width="128" height="128" rx="28" fill="url(#g5b)"/>
          <circle cx="52" cy="50" r="28" fill="none" stroke="#ffffff" stroke-width="11"/>
          <circle cx="52" cy="50" r="17" fill="#ffffff18"/>
          <line x1="73" y1="71" x2="98" y2="97" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
        </svg>
        <div class="label">48</div>
      </div>
      <div>
        <svg width="16" height="16" viewBox="0 0 128 128">
          <defs>
            <linearGradient id="g5c" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#2e4057"/>
              <stop offset="100%" stop-color="#1b5e20"/>
            </linearGradient>
          </defs>
          <rect width="128" height="128" rx="28" fill="url(#g5c)"/>
          <circle cx="52" cy="50" r="28" fill="none" stroke="#ffffff" stroke-width="11"/>
          <circle cx="52" cy="50" r="17" fill="#ffffff18"/>
          <line x1="73" y1="71" x2="98" y2="97" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
        </svg>
        <div class="label">16</div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
